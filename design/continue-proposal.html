:root{--canvas:oklch(97% .004 175);--paper:oklch(99.5% .002 175);--ink:oklch(23% .017 175);--muted:oklch(47% .018 175);--line:oklch(84% .012 175);--accent:oklch(35% .048 175);--wash:oklch(93% .013 175);--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;color-scheme:light}*{box-sizing:border-box}body{margin:0;font:1rem/1.5 Barlow,sans-serif;color:var(--ink);background:var(--canvas)}button,input,textarea,select{font:inherit}button,a.button{min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 1px 0 var(--line);font-size:.875rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover,a.button:hover{background:var(--wash);border-color:var(--muted)}button:active,a.button:active{box-shadow:inset 0 1px 2px var(--line)}.primary,a.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}.primary:hover,a.primary:hover{background:var(--ink);color:var(--paper)}.ghost{border-color:transparent;background:transparent;box-shadow:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}h1,h2,h3,p{margin:0}h1,h2{font-family:Bricolage,Barlow,sans-serif;font-weight:600;letter-spacing:-.03em}h1{font-size:1.5rem}h2{font-size:1.5rem;line-height:1.3}h3{font-size:1rem;font-weight:600}.muted{color:var(--muted)}.small{font-size:.75rem;color:var(--muted)}.prototype{background:var(--ink);color:var(--paper);font-size:.75rem;padding:8px 24px;display:flex;justify-content:space-between}.topbar{padding:0 32px;height:72px;display:flex;align-items:center;gap:48px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{font-family:Bricolage,Barlow,sans-serif;font-size:1.25rem;letter-spacing:-.04em}.topbar nav{height:100%;display:flex;gap:24px}.topbar nav button{border:0;border-radius:0;box-shadow:none;background:transparent;padding:0 4px;color:var(--muted)}.topbar nav button[aria-current=page]{color:var(--ink);border-bottom:2px solid var(--accent);font-weight:600}.account{margin-left:auto;width:36px;padding:0;border-radius:50%;font-size:.75rem}.workspace{max-width:1240px;padding:32px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:24px}.heading>div{display:flex;align-items:baseline;gap:16px}.heading select{max-width:220px}.capture{display:flex;gap:8px;margin-bottom:32px}.capture input{flex:1}.capture button{white-space:nowrap}input,textarea,select{border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);padding:8px 12px;min-width:0;font-size:.875rem}input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}textarea{width:100%;min-height:88px;resize:vertical}label{display:grid;gap:8px;font-size:.875rem;color:var(--muted)}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:40px}.task-list{display:grid;align-content:start;gap:0}.list-heading{font-size:.75rem;color:var(--muted);margin-bottom:12px}.task-row{width:100%;display:block;text-align:left;padding:16px;border:1px solid transparent;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent}.task-row strong{font-size:1rem;font-weight:500;display:block}.task-row>span{display:block;margin-top:8px;color:var(--muted);font-size:.875rem;line-height:1.4}.task-row small{display:block;margin-top:12px;color:var(--muted);font-size:.75rem}.task-row[aria-pressed=true]{background:var(--paper);border:1px solid var(--line);border-radius:5px}.task-row[aria-pressed=true] strong{font-weight:600}.detail{background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:hidden}.detail-heading{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.detail-heading h2{max-width:36 </style></head><body><a class="skip" href="#workspace">Skip to content</a><div class="prototype"><span>Continue proposal · sample workspace</span><span>Saved references only · no GitHub sync · refresh resets changes</span></div><header class="topbar"><strong class="brand">pomogit</strong><nav aria-label="Workspace"><button data-view="continue" aria-current="page">Continue</button><button data-view="board">Board</button><button data-view="activity">Activity</button></nav><button class="account" id="account" aria-label="Profile and settings">PN</button></header><main class="workspace" id="workspace" tabindex="-1"><header class="heading"><div><h1 id="heading">Continue</h1><span class="small" id="count"></span></div><select id="project" aria-label="Filter projects"></select></header><form class="capture" id="capture"><input id="capture-text" aria-label="Capture a task title or reference link" placeholder="A task title or reference link is enough" required><button type="submit">Save</button></form><div id="notice" class="notice" role="status"></div><section id="surface"></section></main><dialog id="edit-dialog" aria-labelledby="edit-heading"><form id="edit-form"><header class="dialog-top"><h2 id="edit-heading">Edit task</h2><button type="button" class="ghost" data-close="edit-dialog" aria-label="Close task editor">✕</button></header><div class="dialog-body"><label>Title<input name="title" required></label><label>Next step · optional<textarea name="next"></textarea></label><label>Project · optional<input name="project" list="projects"><datalist id="projects"></datalist></label><label>Reference link · optional<input name="reference" type="url"></label><label>Status<select name="status"><option value="inbox">Inbox</option><option value="ready">Ready</option><option value="progress">In progress</option><option value="done">Done</option></select></label></div><footer class="dialog-footer"><button class="primary">Save changes</button></footer></form></dialog><dialog id="account-dialog" aria-labelledby="account-heading"><header class="dialog-top"><h2 id="account-heading">Profile & settings</h2><button class="ghost" data-close="account-dialog" aria-label="Close profile">✕</button></header><div class="dialog-body"><label>Name<input value="Phong Nguyen"></label><p class="small">Identity fields are illustrative in this proposal. Timer use is optional; this sample timer runs for 25 minutes.</p></div></dialog>
<script>
const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const statuses=[['inbox','Inbox'],['ready','Ready'],['progress','In progress'],['done','Done']];
let tasks=[{id:1,title:'Fix the OAuth callback retry',project:'checkout-api',status:'progress',next:'Reproduce the expired-code case, then check the retry response.',reference:'https://example.com/pull/42',notes:[{text:'The retry works for a network timeout. An expired authorization code still returns a generic error. The callback test already has a fixture for this case.',date:'Yesterday · 17:42'}]},{id:2,title:'Keep search filters after going back',project:'web-client',status:'progress',next:'Check Back navigation after opening a result.',reference:'https://example.com/issues/18',notes:[{text:'Query parameters are preserved on refresh. Back navigation still resets the selected project.',date:'Yesterday · 14:10'}]},{id:3,title:'Check keyboard access to the task editor',project:'web-client',status:'ready',next:'Verify Escape closes the editor and returns focus.',reference:'',notes:[{text:'Fields follow the expected tab order. Focus return has not been checked yet.',date:'Wednesday · 11:20'}]}];let view='continue',selected=1,timer=null,seconds=1500,paused=false,dragged=null;
function visible(){return tasks.filter(t=>!$('project').value||t.project===$('project').value)}function current(){return tasks.find(t=>t.id===selected)}
function notify(message){$('notice').textContent=message}
function render(){const project=$('project').value;const names=[...new Set(tasks.map(t=>t.project).filter(Boolean))].sort();$('project').innerHTML='<option value="">All projects</option>'+names.map(n=>`<option ${n===project?'selected':''}>${esc(n)}</option>`).join('');$('projects').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');$('heading').textContent=view==='continue'?'Continue':view==='board'?'Board':'Activity';$('count').textContent=`${visible().filter(t=>t.status!=='done').length} unfinished`;document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(view==='continue'){const list=visible().filter(t=>t.status!=='done');if(!list.some(t=>t.id===selected))selected=list[0]?.id;const t=current();$('surface').className='layout';$('surface').innerHTML=`<aside class="task-list" aria-label="Unfinished work"><p class="list-heading">Unfinished work</p>${list.map(t=>`<button class="task-row" data-select="${t.id}" aria-pressed="${selected===t.id}"><strong>${esc(t.title)}</strong><span>${esc(t.next||t.notes.at(-1)?.text||'No saved context yet')}</span><small>${esc(t.project||'No project')} · ${statuses.find(s=>s[0]===t.status)[1]}</small></button>`).join('')}</aside>${t?detail(t):'<div class="empty"><h2>No unfinished work.</h2><p>Save a task title or reference link above when you need it.</p></div>'}`}else if(view==='board'){$('surface').className='board';$('surface').innerHTML=statuses.map(([status,label])=>`<section class="lane" data-drop="${status}"><h3>${label}<span>${visible().filter(t=>t.status===status).length}</span></h3>${visible().filter(t=>t.status===status).map(t=>`<article class="board-card" draggable="true" data-task="${t.id}"><button data-select="${t.id}">${esc(t.title)}</button><p class="small">${esc(t.project||'No project')}</p><select data-status="${t.id}" aria-label="Status for ${esc(t.title)}">${statuses.map(([s,l])=>`<option value="${s}" ${t.status===s?'selected':''}>${l}</option>`).join('')}</select></article>`).join('')||'<p class="small">No tasks</p>'}</section>`).join('')}else{$('surface').className='activity';$('surface').innerHTML=visible().flatMap(t=>t.notes.map(n=>({t,n}))).reverse().map(({t,n})=>`<article><p class="small">${esc(n.date)} · ${esc(t.project||'No project')}</p><button class="ghost" data-select="${t.id}">${esc(t.title)}</button><p>${esc(n.text)}</p></article>`).join('')||'<p class="empty">Notes will appear here when you add them.</p>'}renderTimer()}
function detail(t){const last=t.notes.at(-1);return `<article class="detail"><header class="detail-heading"><div><p class="small">${esc(t.project||'No project')} · ${statuses.find(s=>s[0]===t.status)[1]}</p><h2>${esc(t.title)}</h2></div><button class="ghost" id="edit">Edit</button></header><div class="detail-body"><section class="next-step"><p class="section-label">Next step</p><p>${esc(t.next||'No next step saved. You can add one whenever it helps.')}</p></section><div class="actions">${t.reference?`<a class="button primary" href="${esc(t.reference)}" target="_blank" rel="noopener noreferrer">Open reference ↗</a>`:'<button id="add-reference">Add reference</button>'}<button class="ghost" id="jump-note">Add note</button></div><section class="saved-context"><div class="reference"><span class="section-label">Where you left off</span><span class="small">${last?esc(last.date):'No notes yet'}</span></div><p>${last?esc(last.text):'Nothing to record? Leave this empty and get on with your work.'}</p>${t.reference?`<div class="reference"><a href="${esc(t.reference)}" target="_blank" rel="noopener noreferrer">${esc(new URL(t.reference).pathname)}</a><span class="small">Manually saved · sample link</span></div>`:''}</section><form class="note-form" id="note-form"><label>Add a note · optional<textarea id="note" placeholder="What would help you pick this up later?"></textarea></label><details><summary>Update the next step</summary><label>Next step<input id="next-note" value="${esc(t.next)}"></label></details><button type="submit">Save note</button></form></div><footer class="detail-footer"><div id="timer" class="timer"></div><button class="ghost" id="complete">Mark done</button></footer></article>`}
function renderTimer(){if(!$('timer'))return;const active=timer===selected;$('timer').innerHTML=timer?`<time>${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}</time><span class="small">${paused?'Paused':'Running'}${active?'':' · another task'}</span><button id="pause">${paused?'Resume':'Pause'}</button><button id="end">End timer</button>`:'<span class="small">Timer optional</span><button id="start">Start 25 min</button>'}
function openEditor(){const t=current(),f=$('edit-form');for(const key of ['title','next','project','reference','status'])f.elements[key].value=t[key]||'';$('edit-dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;notify('');render()}if(b.dataset.select){selected=Number(b.dataset.select);view='continue';render()}if(b.dataset.close)$(b.dataset.close).close();if(['edit','add-reference'].includes(b.id))openEditor();if(b.id==='jump-note'){$('note').focus();$('note').scrollIntoView({block:'center'})}if(b.id==='account')$('account-dialog').showModal();if(b.id==='start'){timer=selected;seconds=1500;paused=false;current().status='progress';render()}if(b.id==='pause'){paused=!paused;renderTimer()}if(b.id==='end'){timer=null;notify('Timer ended. Add a note if it helps; your task stays unfinished.');renderTimer()}if(b.id==='complete'){if(timer===selected){notify('End this task’s timer before marking it done.');return}current().status='done';notify('Task marked done. You can reopen it from Board.');render()}});
document.addEventListener('submit',e=>{if(e.target.id==='note-form'){e.preventDefault();const note=$('note').value.trim(),next=$('next-note').value.trim();if(!note&&next===current().next){notify('No changes to save.');return}if(note)current().notes.push({text:note,date:'Just now'});current().next=next;notify('Saved.');render()}});
$('capture').onsubmit=e=>{e.preventDefault();const value=$('capture-text').value.trim();if(!value)return;let url='';try{const parsed=new URL(value);if(['https:','http:'].includes(parsed.protocol))url=parsed.href}catch{}const id=Math.max(0,...tasks.map(t=>t.id))+1;tasks.push({id,title:url?new URL(url).pathname.slice(1)||new URL(url).hostname:value,project:$('project').value,status:'inbox',next:'',reference:url,notes:[]});selected=id;view='continue';$('capture').reset();notify('Saved. Details can wait.');render()};
$('edit-form').onsubmit=e=>{e.preventDefault();const f=e.target;const title=f.elements.title.value.trim();if(!title)return;const reference=f.elements.reference.value.trim();if(reference){try{const url=new URL(reference);if(!['http:','https:'].includes(url.protocol))throw new Error()}catch{f.elements.reference.setCustomValidity('Use an http or https reference link.');f.elements.reference.reportValidity();return}}for(const key of ['title','next','project','reference','status'])current()[key]=f.elements[key].value.trim();$('edit-dialog').close();notify('Task updated.');render()};$('project').onchange=render;document.addEventListener('input',e=>{if(e.target.name==='reference')e.target.setCustomValidity('')});document.addEventListener('change',e=>{if(e.target.dataset.status){tasks.find(t=>t.id===Number(e.target.dataset.status)).status=e.target.value;render()}});document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-task]');if(card){dragged=Number(card.dataset.task);e.dataTransfer.setData('text/plain',String(dragged))}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault()});document.addEventListener('drop',e=>{const lane=e.target.closest('[data-drop]');if(lane&&dragged){e.preventDefault();tasks.find(t=>t.id===dragged).status=lane.dataset.drop;dragged=null;render()}});setInterval(()=>{if(timer&&!paused&&seconds>0){seconds--;if(seconds===0)paused=true;renderTimer()}},1000);render();const scene=new URLSearchParams(location.search).get('scene');if(scene==='board'){view='board';render()}if(scene==='edit')openEditor();if(scene==='empty'){tasks=[];render()}
</script></body></html>
