<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomogit — Workbench proposal</title>
<style>

;border-bottom:1px solid var(--line)}.tools input{max-width:260px;background:transparent}.tools select{max-width:200px;background:transparent}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:24px 0 48px}.column{min-width:0}.column-head{display:flex;align-items:center;gap:8px;padding:0 0 16px;border-bottom:1px solid var(--ink);margin-bottom:16px}.lane-number{font-size:.75rem;color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}.column-head h3{font-size:.875rem}.column-head .count{font-size:.75rem;color:var(--muted)}.column-head button{margin-left:auto;padding:0 8px;min-height:28px;line-height:1;background:transparent;box-shadow:none;border-color:transparent;font-size:1rem}.column-head button:hover{background:var(--wash);border-color:var(--line)}.cards{display:grid;align-content:start;gap:12px;min-height:300px}.cards.dragover{outline:2px dashed var(--accent);outline-offset:4px;background:var(--wash)}.card{padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--paper);display:grid;gap:16px;box-shadow:0 2px 0 oklch(88% .009 60)}.card:hover{border-color:var(--muted)}.card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted)}.card-header button{font-size:.75rem;min-height:28px;padding:2px 8px}.card-title{font-size:1rem;line-height:1.35;font-weight:600;min-height:0;padding:0;text-align:left;border:0;background:transparent;box-shadow:none}.card-title:hover{color:var(--accent);background:transparent}.next{font-size:.875rem;line-height:1.45}.next span{display:block;color:var(--muted);font-size:.75rem;margin-bottom:4px}.change{font-size:.75rem;line-height:1.45;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}.card-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--muted)}.project{font-size:.75rem;font-weight:500;display:flex;align-items:center;gap:6px}.project::before{content:'';width:6px;height:6px;border:1px solid currentColor;border-radius:50%}.card-footer select{font-size:.75rem;padding:3px 6px;max-width:100%;background:transparent}.card[data-state=progress]{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 2px 0 oklch(12% .006 35)}.card[data-state=progress] .card-header,.card[data-state=progress] .next span,.card[data-state=progress] .change,.card[data-state=progress] .card-footer{color:oklch(80% .012 60)}.card[data-state=progress] .change{border-color:oklch(45% .015 35)}.card[data-state=progress] button:not(.card-title){background:oklch(32% .014 35);color:var(--paper);border-color:oklch(50% .014 35);box-shadow:0 2px 0 oklch(13% .006 35)}.card[data-state=progress] select{color:var(--paper);border-color:oklch(50% .014 35);color-scheme:dark}.card[data-state=progress] .card-title:hover{color:oklch(85% .08 40)}.empty{font-size:.875rem;color:var(--muted);padding:16px 0}.mobile-status{display:none}.session{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px;margin-bottom:16px;border:1px solid var(--accent);background:oklch(93% .02 35);border-radius:4px}.session>div{display:flex;align-items:center;gap:12px}.session strong{font-size:.875rem}.session time{color:var(--accent);font-variant-numeric:tabular-nums}.status-dot{width:7px;height:7px;background:var(--accent);border-radius:50%}.notice{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:.875rem;color:var(--muted)}.content{padding:24px 0 48px;max-width:800px}.activity-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:24px;padding:24px 0;border-top:1px solid var(--line)}.activity-row p{font-size:.875rem;margin-top:8px}.activity-row time{font-size:.75rem;color:var(--muted)}dialog{width:min(800px,calc(100% - 48px));max-height:calc(100dvh - 64px);padding:0;border:1px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);overflow:auto;box-shadow:0 16px 48px oklch(20% .01 35 / .2)}dialog::backdrop{background:oklch(25% .01 35 / .5)}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);font-size:.875rem;background:var(--canvas)}.dialog-body{padding:32px;display:grid;gap:24px}.dialog-body input[name=title]{font-family:Bricolage,Barlow,sans-serif;font-size:1.5rem;font-weight:600}.properties{display:grid;grid-template-columns:1fr 1fr;gap:24px}.properties select{width:100%}.dialog-footer{display:flex;justify-content:space-between;gap:16px;padding:16px 32px;border-top:1px solid var(--line);background:var(--canvas)}.notes{display:grid;gap:16px}.note{padding:12px 0;border-top:1px solid var(--line);font-size:.875rem}.note time{color:var(--muted);font-size:.75rem}.focus-layout{display:grid;grid-template-columns:minmax(0,1fr) 264px;min-height:60vh}.focus-main{padding:40px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:24px}.focus-main h2{font-size:1.875rem;line-height:1.2;max-width:24ch}.focus-main p{color:var(--muted);max-width:48ch}.clock{font-family:Bricolage,Barlow,sans-serif;font-size:3.75rem;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.focus-context{padding:24px;background:var(--canvas);border-left:1px solid var(--line)}.focus-context ol{list-style:none;padding:0;margin:16px 0}.focus-context li{padding:16px 0;border-top:1px solid var(--line);font-size:.875rem}.focus-context li span{display:block;color:var(--muted);font-size:.75rem;margin-top:8px}.focus-controls{display:flex;gap:8px}.utility{max-width:560px;display:grid;gap:32px}.utility section{display:grid;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line)}.skip-link{position:fixed;z-index:10;left:16px;top:16px;background:var(--ink);color:var(--paper);padding:12px;transform:translateY(-200%)}.skip-link:focus{transform:none}[hidden]{display:none!important}
@media(max-width:1250px){.shell{grid-template-columns:192px minmax(0,1fr)}.rail{padding-inline:20px}.main{padding-inline:24px}.board{gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}.cards{min-height:180px}}
@media(max-width:760px){button{min-height:44px}.preview{padding:8px 16px}.preview span:last-child{display:none}.shell{display:block}.rail{position:static;height:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;padding:20px 16px 0;gap:16px;border-right:0}.brand{font-size:1.5rem}.rail>section:first-of-type{grid-column:1/-1;grid-row:2}.rail nav{display:flex;gap:24px;border-bottom:1px solid var(--line)}.rail nav button{min-height:44px;padding:8px 0}.rail nav button[aria-current=page]{border-bottom:2px solid var(--accent)}.rail>section:nth-of-type(2){display:none}.rail-label{display:none}.rail-footer{grid-column:2;grid-row:1;margin:0;border:0;padding:0}.account{min-height:44px}.account>div,.account>span:last-child{display:none}.main{padding:0 16px}.top{padding:24px 0 20px;gap:12px}.top-heading{display:block}h1{font-size:1.5rem}.page-subtitle{font-size:.75rem;margin-top:4px}.tools{flex-wrap:wrap;padding-bottom:16px}.tools input{max-width:none;flex:1 1 100%;min-height:44px}.tools select{max-width:none;flex:1;min-height:44px}.mobile-status{display:block}.board{grid-template-columns:1fr;gap:24px;padding:24px 0}.column-head{margin-bottom:12px}.column-head button{min-height:44px;min-width:44px}.cards{min-height:0}.card{padding:16px}.card-header button{min-height:36px}.card-footer select{min-height:36px}.session{flex-direction:column;align-items:flex-start}.session>div{flex-wrap:wrap}.notice{flex-wrap:wrap}.activity-row{grid-template-columns:1fr;gap:8px}dialog{width:100%;height:100dvh;max-height:100dvh;max-width:none;margin:0;border:0;border-radius:0}.dialog-top{padding:12px 16px}.dialog-body{padding:24px 16px}.properties{grid-template-columns:1fr}.dialog-footer{padding:16px;position:sticky;bottom:0}.focus-layout{grid-template-columns:1fr}.focus-main{padding:32px 24px}.focus-main h2{font-size:1.5rem}.focus-context{border-left:0;border-top:1px solid var(--line)}.clock{font-size:3rem}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<div class="preview"><span>Workbench proposal · Sample workspace</span><span>Prototype · Changes reset on refresh</span></div>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="shell"><aside class="rail" aria-label="Workspace sidebar">
  <div class="brand">pomogit<span>.</span></div>
  <section><nav aria-label="Workspace">
    <button data-view="board" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg></span>Board<span class="nav-count" id="board-count">5</span></button>
    <button data-view="activity"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h4l3-7 3 14 3-7h3"/></svg></span>Activity</button>
  </nav></section>
  <section><p class="rail-label">Projects</p><nav class="rail-projects" id="project-shortcuts" aria-label="Project shortcuts"></nav></section>
  <footer class="rail-footer"><button class="account" data-view="profile" aria-label="Open profile and settings"><span class="avatar">PN</span><div><strong>Phong Nguyen</strong><small>Profile & settings</small></div><span aria-hidden="true">↗</span></button></footer>
</aside>
<main class="main" id="main-content" tabindex="-1"><header class="top"><div class="top-heading"><h1 id="page-title">Board</h1><p class="page-subtitle" id="page-subtitle">A clear place for everything in motion.</p></div><button class="primary" id="new-task">+ New task</button></header><div id="session"></div><div id="notice" role="status"></div><div class="tools" id="tools"><input id="search" type="search" aria-label="Search tasks" placeholder="Search tasks…"><select id="project-filter" aria-label="Filter by project"></select><select id="status-filter" class="mobile-status" aria-label="Filter by status"><option value="all">All statuses</option><option value="inbox">Inbox</option><option value="ready">Ready</option><option value="progress">In progress</option><option value="done">Done</option></select></div><div id="page"></div></main></div>
<dialog id="task-dialog" aria-labelledby="task-heading"><form id="task-form"><header class="dialog-top"><span id="task-heading">Task details</span><button type="button" class="ghost" data-close="task-dialog" aria-label="Close task details">✕</button></header><div class="dialog-body"><label>Title<input name="title" required placeholder="What outcome do you want?"></label><label>Next step<textarea name="next" required placeholder="What is the next concrete action?"></textarea></label><div class="properties"><label>Status<select name="status"><option value="inbox">Inbox</option><option value="ready">Ready</option><option value="progress">In progress</option><option value="done">Done</option></select></label><label>Project<input name="project" list="project-names" placeholder="Choose or create a project"><datalist id="project-names"></datalist></label></div><label>Reference link<input type="url" name="reference" placeholder="https://…"></label><section class="notes"><h3>Change notes</h3><div id="task-notes"></div><label>Add a note<textarea name="note" placeholder="What changed? Add a note when you’re ready."></textarea></label></section></div><footer class="dialog-footer"><button type="button" id="start-focus">Start focus</button><button class="primary" type="submit">Save task</button></footer></form></dialog>
<dialog id="focus-dialog" aria-labelledby="focus-heading"><header class="dialog-top"><span>Focus session</span><button class="ghost" data-close="focus-dialog">Back to Board</button></header><div class="focus-layout"><section class="focus-main"><span class="small" id="focus-project"></span><h2 id="focus-heading"></h2><p id="focus-next"></p><time class="clock" id="clock">25:00</time><div class="focus-controls"><button class="primary" id="pause">Pause</button><button id="end">End session</button></div></section><aside class="focus-context"><h3>Task context</h3><p class="small">Your current and upcoming work</p><ol id="context-list"></ol></aside></div></dialog>
<script>
const stages=[['inbox','Inbox'],['ready','Ready'],['progress','In progress'],['done','Done']];
let tasks=[
{id:1,title:'Clarify empty board behavior',next:'Sketch the first-task capture flow.',project:'Pomogit',status:'inbox',reference:'',notes:[]},
{id:2,title:'Make task dialogs keyboard accessible',next:'Check focus return after Escape.',project:'Pomogit',status:'ready',reference:'',notes:[{text:'Dialog fields now follow a predictable tab order.',date:'Today'}]},
{id:3,title:'Handle failed webhook deliveries',next:'Add a retry case for a timeout response.',project:'API service',status:'ready',reference:'',notes:[{text:'Retry policy documented; timeout case still needs coverage.',date:'Yesterday'}]},
{id:4,title:'Preserve filters when returning to Board',next:'Check project selection after closing a task.',project:'Pomogit',status:'progress',reference:'',notes:[{text:'Project filter is wired into the board.',date:'Today'}]},
{id:5,title:'Document the local development setup',next:'Share the updated setup instructions.',project:'API service',status:'done',reference:'',notes:[{text:'Verified the setup steps from a fresh checkout.',date:'Yesterday'}]}
];
let view='board',selected=null,session=null,remaining=1500,paused=false,dragged=null;
const $=id=>document.getElementById(id);const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const projects=()=>[...new Set(tasks.map(t=>t.project).filter(Boolean))].sort();const name=status=>stages.find(s=>s[0]===status)[1];
function filtered(){return tasks.filter(t=>(!$('project-filter').value||t.project===$('project-filter').value)&&`${t.title} ${t.next} ${t.project}`.toLowerCase().includes($('search').value.toLowerCase()))}
function card(t){return `<article class="card" data-state="${t.status}" draggable="true" data-task="${t.id}"><div class="card-header"><span>PG-${String(t.id).padStart(3,'0')}</span><button data-open="${t.id}" aria-label="Open ${esc(t.title)}">View</button></div><button class="card-title" data-open="${t.id}">${esc(t.title)}</button><p class="next"><span>Next step</span>${esc(t.next)}</p><p class="change">${t.notes.length?esc(t.notes.at(-1).text):'No change note yet'}</p><footer class="card-footer"><span class="project" data-project="${esc(t.project)}">${esc(t.project||'No project')}</span><select data-status="${t.id}" aria-label="Status for ${esc(t.title)}">${stages.map(([id,label])=>`<option value="${id}" ${t.status===id?'selected':''}>${label}</option>`).join('')}</select></footer></article>`}
function render(){const filter=$('project-filter').value;$('board-count').textContent=tasks.length;$('project-shortcuts').innerHTML=[['','All projects'],...projects().map(p=>[p,p])].map(([value,label])=>`<button data-project-filter="${esc(value)}" aria-pressed="${filter===value}"><span class="project-dot ${value==='API service'?'mint':''}" aria-hidden="true"></span>${esc(label)}<span class="nav-count">${value?tasks.filter(t=>t.project===value).length:tasks.length}</span></button>`).join('');$('page-subtitle').textContent=view==='board'?(filter||'All projects'):view==='activity'?'Notes & sessions':'Account';$('project-filter').innerHTML='<option value="">All projects</option>'+projects().map(p=>`<option ${p===filter?'selected':''}>${esc(p)}</option>`).join('');$('project-names').innerHTML=projects().map(p=>`<option value="${esc(p)}">`).join('');$('page-title').textContent=view==='board'?'Board':view==='activity'?'Activity':'Profile';$('tools').hidden=view!=='board';$('new-task').hidden=view!=='board';document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
if(view==='board'){$('page').className='board';$('page').innerHTML=stages.map(([id,label],index)=>`<section class="column" data-column="${id}" ${matchMedia('(max-width:760px)').matches&&$('status-filter').value!=='all'&&$('status-filter').value!==id?'hidden':''}><header class="column-head"><span class="lane-number">${String(index+1).padStart(2,'0')}</span><h3>${label}</h3><span class="count">${filtered().filter(t=>t.status===id).length}</span><button class="ghost" data-add="${id}" aria-label="Add task to ${label}">+</button></header><div class="cards" data-drop="${id}">${filtered().filter(t=>t.status===id).map(card).join('')||'<p class="empty">No tasks here.</p>'}</div></section>`).join('')}
else if(view==='activity'){$('page').className='content';$('page').innerHTML='<p class="small" style="margin-bottom:20px">Change notes and session history</p>'+tasks.flatMap(t=>t.notes.map(n=>({t,n}))).reverse().map(({t,n})=>`<article class="activity-row"><time>${esc(n.date)}</time><div><button class="card-title" data-open="${t.id}">${esc(t.title)}</button><p>${esc(n.text)}</p><p class="small">${esc(t.project||'No project')} · ${name(t.status)}</p></div></article>`).join('')}
else{$('page').className='content utility';$('page').innerHTML='<section><h2>Profile</h2><label>Name<input value="Phong Nguyen"></label><label>About<textarea>Building tools for focused developer work.</textarea></label><p class="small">Identity fields are illustrative in this proposal.</p></section><section><h2>Settings</h2><label>Session duration<select id="duration"><option value="1500">25 minutes</option><option value="3000">50 minutes</option></select></label><p class="small">Project names are created directly from the task dialog.</p></section>'}renderSession()}
function openTask(id,status='inbox'){selected=id?tasks.find(t=>t.id===Number(id)):null;const f=$('task-form');f.reset();f.elements.title.value=selected?.title||'';f.elements.next.value=selected?.next||'';f.elements.project.value=selected?.project||'';f.elements.reference.value=selected?.reference||'';f.elements.status.value=selected?.status||status;$('task-heading').textContent=selected?`PG-${String(selected.id).padStart(3,'0')} · Task details`:'New task';$('task-notes').innerHTML=selected?.notes.map(n=>`<div class="note"><time>${esc(n.date)}</time><p>${esc(n.text)}</p></div>`).join('')||'<p class="small">Notes are optional. Add context when something changes.</p>';$('start-focus').hidden=!selected||selected.status==='done';$('start-focus').disabled=!!session;$('task-dialog').showModal()}
function saveTask(){const f=$('task-form');if(!f.reportValidity())return null;const values={title:f.elements.title.value.trim(),next:f.elements.next.value.trim(),project:f.elements.project.value.trim(),reference:f.elements.reference.value.trim(),status:f.elements.status.value};if(!values.title||!values.next)return null;if(!selected){selected={id:Math.max(...tasks.map(t=>t.id))+1,notes:[],...values};tasks.push(selected)}else Object.assign(selected,values);if(f.elements.note.value.trim())selected.notes.push({text:f.elements.note.value.trim(),date:'Just now'});$('task-dialog').close();render();return selected}
function renderSession(){const task=tasks.find(t=>t.id===session);$('session').innerHTML=task?`<div class="session"><div><span class="status-dot" data-status="progress"></span><strong>${esc(task.title)}</strong><time>${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</time><span class="small">${paused?'Paused':'Focusing'}</span></div><button data-focus>Open focus</button></div>`:'';$('clock').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}
function openFocus(){const t=tasks.find(t=>t.id===session);$('focus-heading').textContent=t.title;$('focus-project').textContent=t.project||'No project';$('focus-next').textContent='Next · '+t.next;$('context-list').innerHTML=[t,...tasks.filter(x=>x.id!==t.id&&['ready','progress'].includes(x.status)).slice(0,3)].map(x=>`<li><strong>${esc(x.title)}</strong><span>${x.id===t.id?'Current task':name(x.status)} · ${esc(x.next)}</span></li>`).join('');$('pause').textContent=paused?'Resume':'Pause';$('focus-dialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}if(b.hasAttribute('data-project-filter')){view='board';$('project-filter').value=b.dataset.projectFilter;render()}if(b.dataset.open)openTask(b.dataset.open);if(b.dataset.add)openTask(null,b.dataset.add);if(b.dataset.close)$(b.dataset.close).close();if(b.hasAttribute('data-focus'))openFocus();if(b.dataset.note)openTask(b.dataset.note)});
$('new-task').onclick=()=>openTask();$('task-form').onsubmit=e=>{e.preventDefault();saveTask()};$('start-focus').onclick=()=>{const task=saveTask();if(!task)return;task.status='progress';session=task.id;remaining=Number($('duration')?.value||1500);paused=false;$('notice').innerHTML='';render();openFocus()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';renderSession()};$('end').onclick=()=>{const id=session;const task=tasks.find(t=>t.id===id);task.notes.push({text:'Focus session ended.',date:'Just now'});session=null;$('focus-dialog').close();view='board';render();$('notice').innerHTML=`<div class="notice"><span>Session ended. Your task stays In progress.</span><button class="ghost" data-note="${id}">Add note</button><button class="ghost" id="dismiss">Dismiss</button></div>`;$('dismiss').onclick=()=>{$('notice').innerHTML=''}};
$('search').oninput=render;$('project-filter').onchange=render;$('status-filter').onchange=render;document.addEventListener('change',e=>{if(e.target.dataset.status){tasks.find(t=>t.id===Number(e.target.dataset.status)).status=e.target.value;render()}});document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-task]');if(card){dragged=Number(card.dataset.task);e.dataTransfer.setData('text/plain',String(dragged))}});document.addEventListener('dragover',e=>{const drop=e.target.closest('[data-drop]');if(drop){e.preventDefault();drop.classList.add('dragover')}});document.addEventListener('dragleave',e=>e.target.closest('[data-drop]')?.classList.remove('dragover'));document.addEventListener('drop',e=>{const drop=e.target.closest('[data-drop]');if(drop&&dragged){e.preventDefault();tasks.find(t=>t.id===dragged).status=drop.dataset.drop;dragged=null;render()}});matchMedia('(max-width:760px)').addEventListener('change',render);setInterval(()=>{if(session&&!paused&&remaining>0){remaining--;renderSession();if(!remaining){paused=true;$('pause').textContent='Resume'}}},1000);render();
const scene=new URLSearchParams(location.search).get('scene');
if(scene==='task')openTask(2);
if(scene==='focus'){session=4;render();openFocus()}
if(scene==='activity'){view='activity';render()}

</script></body></html>
