name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject common committed credential formats
        shell: bash
        run: |
          if git grep -nI -E '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|aws_secret_access_key[[:space:]]*=|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]+|AIza[0-9A-Za-z_-]{30,})' -- . ':(exclude)*-lock.json'; then
            echo 'Potential credential material detected. Remove it and rotate the credential before continuing.' >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload immutable frontend artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate JavaScript syntax
        run: npm run check

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without a state backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  release-rehearsal:
    name: Release rehearsal (no deploy)
    if: github.event_name != 'pull_request'
    needs:
      - repository-safety
      - frontend
      - backend
      - terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: deployment-rehearsal

    steps:
      - name: Download the tested frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-${{ github.sha }}
          path: release/frontend

      - name: Verify release bundle
        shell: bash
        run: |
          test -f release/frontend/index.html
          find release/frontend -type f -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
          test -s release/SHA256SUMS

      - name: Confirm deployment is intentionally disabled
        shell: bash
        run: |
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          echo "No AWS credentials are available and no cloud command will run."

      - name: Publish rehearsal summary
        shell: bash
        run: |
          file_count="$(find release/frontend -type f | wc -l)"
          bundle_size="$(du -sh release/frontend | cut -f1)"
          {
            echo '## Release rehearsal complete'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Files: ${file_count}"
            echo "- Bundle size: ${bundle_size}"
            echo '- Terraform: formatted, initialized without a backend, and validated'
            echo '- AWS deployment: **disabled**'
            echo
            echo 'When deployment is enabled later, this exact artifact will be synced to the private S3 bucket and the CloudFront cache will be invalidated.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload rehearsed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 7
